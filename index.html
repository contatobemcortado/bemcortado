<title>Bem Cortado Papelaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#1F3A5F; --laranja:#E8762B; --laranja-t:#B4541A; --verde:#1C9E50;
  --fundo:#F2F4F7; --cartao:#FFFFFF; --texto:#1A2433; --suave:#5F6B7C; --linha:#DDE3EA;
  --topo:#1F3A5F; --topo-texto:#FFFFFF; --chip:#E7ECF2;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --fundo:#0F1724; --cartao:#182335; --texto:#E8EDF4; --suave:#9AA7B8; --linha:#2A374B;
    --topo:#15253C; --chip:#22314A; --laranja-t:#F29A5C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#0F1724; --cartao:#182335; --texto:#E8EDF4; --suave:#9AA7B8; --linha:#2A374B;
  --topo:#15253C; --chip:#22314A; --laranja-t:#F29A5C;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--topo);color:var(--topo-texto);padding:12px 16px}
.topo-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:40px}
.voltar{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.marca{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1}
.marca small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-top:3px}
.titulo{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;text-wrap:balance}
.migalha{font-size:12px;opacity:.7;letter-spacing:.04em;text-transform:uppercase}

main{max-width:760px;margin:0 auto;padding:18px 16px 0}
.dica{color:var(--suave);font-size:14px;margin:0 0 14px}

/* lista de categorias */
.cats{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.cats{grid-template-columns:1fr 1fr}}
.cat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:16px 16px}
.cat b{font-family:var(--display);font-weight:700;font-size:18px;flex:1}
.cat .qt{font-size:13px;color:var(--suave)}
.cat .qt.breve{color:var(--laranja-t);font-weight:600}
.cat .seta{color:var(--laranja);font-weight:800;font-size:20px}

/* produtos */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prod{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.prod.sel{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.foto{position:relative;background:#fff;aspect-ratio:1/1;max-width:100%}
.foto img{width:100%;height:100%;object-fit:contain;display:block}
.semfoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A96A6;font-size:12px;background:repeating-linear-gradient(45deg,#F4F6F9 0 10px,#EDF0F4 10px 20px)}
.num{position:absolute;top:8px;left:8px;background:var(--laranja);color:#fff;font-weight:700;font-size:12px;border-radius:7px;padding:2px 7px;font-variant-numeric:tabular-nums}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nome{font-weight:600;font-size:14px;line-height:1.3}
.det{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:pre-line}
.preco{font-family:var(--display);font-weight:800;font-size:19px;color:var(--laranja-t);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.add{margin-top:6px;border:0;border-radius:10px;background:var(--verde);color:#fff;font-weight:700;padding:10px 8px;font-size:14px}
.qtd{margin-top:6px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1.5px solid var(--verde);border-radius:10px;overflow:hidden}
.qtd button{border:0;background:transparent;font-size:20px;font-weight:700;color:var(--verde);height:38px}
.qtd span{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.esgotado .foto{opacity:.45}.esg{margin-top:6px;text-align:center;font-weight:700;color:var(--suave);border:1.5px dashed var(--linha);border-radius:10px;padding:9px}
.vazio{background:var(--cartao);border:1px dashed var(--linha);border-radius:14px;padding:28px 18px;text-align:center}
.vazio h3{font-family:var(--display);margin:0 0 6px;font-size:20px}
.vazio p{margin:0 0 16px;color:var(--suave)}
.btn-wa{display:inline-block;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 20px}

/* barra do pedido */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--cartao);border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(15,23,36,.08)}
.barra-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.resumo{flex:1;min-width:0}
.resumo b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.resumo span{font-size:13px;color:var(--suave)}
.ver{border:0;background:var(--navy);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700}
:root[data-theme="dark"] .ver{background:var(--laranja)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ver{background:var(--laranja)}}
.ver:disabled{opacity:.45;cursor:default}

/* folha do pedido */
.folha-fundo{position:fixed;inset:0;z-index:30;background:rgba(10,16,26,.5);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--fundo);width:100%;max-width:760px;max-height:88%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.folha-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.folha-cab h2{margin:0;font-family:var(--display);font-size:22px}
.fechar{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:600}
.itens{overflow-y:auto;padding:4px 16px;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--cartao);border:1px solid var(--linha);border-radius:12px;padding:8px}
.item img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px}
.item .n{font-weight:600;font-size:14px;line-height:1.25}
.item .s{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.item .qtd{margin:0;grid-template-columns:32px 30px 32px}
.item .qtd button{height:32px;font-size:18px}
.folha-pe{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linha)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.total b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
label{font-size:13px;color:var(--suave);font-weight:600}
input{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--cartao);color:var(--texto)}
.enviar{display:block;text-align:center;background:var(--verde);color:#fff;text-decoration:none;font-weight:800;font-size:17px;border-radius:12px;padding:15px}
.limpar{border:0;background:transparent;color:var(--suave);text-decoration:underline;font-size:13px;align-self:center}
.aviso{font-size:12px;color:var(--suave);text-align:center;margin:0}
@media (prefers-reduced-motion:no-preference){.prod,.cat{transition:border-color .15s,box-shadow .15s}}
</style>

<header class="topo"><div class="topo-in" id="topo"></div></header>
<main id="tela"></main>

<div class="barra"><div class="barra-in">
  <div class="resumo"><b id="b-total">R$ 0,00</b><span id="b-itens">Nenhum item escolhido</span></div>
  <button class="ver" id="b-ver" disabled>Ver pedido</button>
</div></div>

<div class="folha-fundo" id="folha" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="f-tit">
    <div class="folha-cab"><h2 id="f-tit">Seu pedido</h2><button class="fechar" id="f-fechar">Continuar escolhendo</button></div>
    <div class="itens" id="f-itens"></div>
    <div class="folha-pe">
      <div class="total"><span>Total</span><b id="f-total">R$ 0,00</b></div>
      <div><label for="f-nome">Seu nome (opcional)</label><input id="f-nome" autocomplete="name" placeholder="Ex.: Maria"></div>
      <a class="enviar" id="f-enviar" href="#" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
      <p class="aviso">Abre o WhatsApp da Bem Cortado com a lista pronta. É só tocar em enviar.</p>
      <button class="limpar" id="f-limpar">Esvaziar pedido</button>
    </div>
  </div>
</div>

const real = v => "R$ " + v.toFixed(2).replace(".", ",");
const $ = id => document.getElementById(id);
let carrinho = {};
try { carrinho = JSON.parse(localStorage.getItem("bc-pedido") || "{}") || {}; } catch (e) { carrinho = {}; }
const salvar = () => { try { localStorage.setItem("bc-pedido", JSON.stringify(carrinho)); } catch (e) {} };
const byId = Object.fromEntries(PRODS.map(p => [p.id, p]));
Object.keys(carrinho).forEach(k => { if (!byId[k]) delete carrinho[k]; });

const prodsDe = id => PRODS.filter(p => p.cat === id);
const contaCat = c => c.sub ? c.sub.reduce((s, x) => s + prodsDe(x.id).length, 0) : prodsDe(c.id).length;
const acharCat = id => { for (const c of CATS) { if (c.id === id) return {c}; for (const s of (c.sub || [])) if (s.id === id) return {c: s, pai: c}; } };
let pilha = []; // histórico de telas

function waLink(txt){ return "https://wa.me/" + FONE + "?text=" + encodeURIComponent(txt); }

function topo(titulo, migalha){
  const t = $("topo");
  if (!pilha.length){
    t.innerHTML = '<div class="marca">BEM CORTADO<small>Papelaria</small></div>';
  } else {
    t.innerHTML = '<button class="voltar" id="voltar">‹ Voltar</button><div><div class="migalha"></div><div class="titulo"></div></div>';
    t.querySelector(".migalha").textContent = migalha;
    t.querySelector(".titulo").textContent = titulo;
    $("voltar").onclick = () => { pilha.pop(); render(); };
  }
}

function listaCats(lista){
  const box = document.createElement("div"); box.className = "cats";
  lista.forEach(c => {
    const n = contaCat(c);
    const b = document.createElement("button"); b.className = "cat";
    b.innerHTML = '<b></b><span class="qt"></span><span class="seta">›</span>';
    b.querySelector("b").textContent = c.nome;
    const q = b.querySelector(".qt");
    q.textContent = n ? n + (n === 1 ? " item" : " itens") : "em breve";
    if (!n) q.classList.add("breve");
    b.onclick = () => { pilha.push(c.id); render(); window.scrollTo(0, 0); };
    box.appendChild(b);
  });
  return box;
}

function cardProduto(p, i){
  const d = document.createElement("article"); d.className = "prod"; d.dataset.id = p.id;
  d.innerHTML = '<div class="foto"><img alt=""><span class="num"></span></div><div class="info"><div class="nome"></div><div class="det"></div><div class="preco"></div><div class="acao"></div></div>';
  const im = d.querySelector("img"); im.alt = p.nome; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
  im.onerror = () => { const f = im.parentNode; im.remove(); const s = document.createElement("div"); s.className = "semfoto"; s.textContent = "Foto indisponível"; f.appendChild(s); };
  if (p.img) im.src = p.img; else im.onerror();
  d.querySelector(".num").textContent = "Nº " + String(i + 1).padStart(2, "0");
  d.querySelector(".nome").textContent = p.nome;
  d.querySelector(".det").textContent = p.det + (p.ean ? "\nCód. " + p.ean : "");
  d.querySelector(".preco").textContent = p.preco ? real(p.preco) : "Consulte";
  if (p.estoque !== undefined && p.estoque !== null && p.estoque <= 0){
    d.classList.add("esgotado"); d.querySelector(".acao").innerHTML = '<div class="esg">Esgotado</div>'; return d;
  }
  desenharAcao(d, p);
  return d;
}

function stepper(p){
  const q = document.createElement("div"); q.className = "qtd";
  q.innerHTML = '<button aria-label="Tirar um">−</button><span></span><button aria-label="Mais um">+</button>';
  q.querySelector("span").textContent = carrinho[p.id];
  const [menos, , mais] = q.children;
  menos.onclick = () => mudar(p.id, -1); mais.onclick = () => mudar(p.id, 1);
  return q;
}

function desenharAcao(d, p){
  const a = d.querySelector(".acao"); a.innerHTML = "";
  if (carrinho[p.id]) { a.appendChild(stepper(p)); d.classList.add("sel"); }
  else {
    const b = document.createElement("button"); b.className = "add"; b.textContent = "+ Adicionar";
    b.onclick = () => mudar(p.id, 1); a.appendChild(b); d.classList.remove("sel");
  }
}

function mudar(id, delta){
  carrinho[id] = (carrinho[id] || 0) + delta;
  if (carrinho[id] <= 0) delete carrinho[id];
  salvar();
  document.querySelectorAll('.prod[data-id="' + id + '"]').forEach(d => desenharAcao(d, byId[id]));
  atualizarBarra();
  if (!$("folha").hidden) desenharFolha();
}

function render(){
  const tela = $("tela"); tela.innerHTML = "";
  const atual = pilha[pilha.length - 1];
  if (!atual){
    topo();
    const p = document.createElement("p"); p.className = "dica";
    p.textContent = "Escolha a categoria, adicione quantos produtos quiser e envie o pedido completo pelo WhatsApp no final.";
    tela.append(p, listaCats(CATS));
    return;
  }
  const {c, pai} = acharCat(atual);
  topo(c.nome, pai ? "Papelaria › " + pai.nome : "Papelaria");
  if (c.sub){ tela.appendChild(listaCats(c.sub)); return; }
  const ps = prodsDe(c.id);
  if (!ps.length){
    const v = document.createElement("div"); v.className = "vazio";
    v.innerHTML = '<h3>Fotos em breve</h3><p>Ainda estamos fotografando esta categoria. Pergunte o que temos:</p><a class="btn-wa" target="_blank" rel="noopener"></a>';
    const a = v.querySelector("a"); a.textContent = "Perguntar sobre " + c.nome; a.href = waLink("Olá! Quero ver opções de " + c.nome);
    tela.appendChild(v); return;
  }
  const g = document.createElement("div"); g.className = "grade";
  ps.forEach((p, i) => g.appendChild(cardProduto(p, i)));
  tela.appendChild(g);
}

function itensPedido(){ return Object.entries(carrinho).map(([id, q]) => ({p: byId[id], q})); }
function totalPedido(){ return itensPedido().reduce((s, {p, q}) => s + (p.preco || 0) * q, 0); }

function atualizarBarra(){
  const its = itensPedido(); const un = its.reduce((s, x) => s + x.q, 0);
  $("b-total").textContent = real(totalPedido());
  $("b-itens").textContent = un ? un + (un === 1 ? " unidade" : " unidades") + " · " + its.length + (its.length === 1 ? " produto" : " produtos") : "Nenhum item escolhido";
  $("b-ver").disabled = !un;
}

function mensagem(){
  const nome = $("f-nome").value.trim();
  let t = "Olá! Quero fazer este pedido" + (nome ? " (" + nome + ")" : "") + ":\n\n";
  itensPedido().forEach(({p, q}) => {
    t += "• " + q + "x " + p.nome + (p.ean ? " – Cód. " + p.ean : "") + " – " + (p.preco ? real(p.preco * q) : "consultar") + "\n";
  });
  t += "\nTotal: " + real(totalPedido());
  return t;
}

function desenharFolha(){
  const box = $("f-itens"); box.innerHTML = "";
  const its = itensPedido();
  if (!its.length){ fecharFolha(); return; }
  its.forEach(({p}) => {
    const r = document.createElement("div"); r.className = "item";
    r.innerHTML = '<img alt=""><div><div class="n"></div><div class="s"></div></div>';
    const ri = r.querySelector("img"); ri.referrerPolicy = "no-referrer"; ri.onerror = () => { ri.style.visibility = "hidden"; }; if (p.img) ri.src = p.img; else ri.onerror();
    r.querySelector(".n").textContent = p.nome;
    r.querySelector(".s").textContent = (p.preco ? real(p.preco) + " cada" : "Consulte") + (p.ean ? " · " + p.ean : "");
    r.appendChild(stepper(p));
    box.appendChild(r);
  });
  $("f-total").textContent = real(totalPedido());
  $("f-enviar").href = waLink(mensagem());
}
function abrirFolha(){ $("folha").hidden = false; desenharFolha(); }
function fecharFolha(){ $("folha").hidden = true; }

$("b-ver").onclick = abrirFolha;
$("f-fechar").onclick = fecharFolha;
$("folha").onclick = e => { if (e.target.id === "folha") fecharFolha(); };
$("f-nome").oninput = () => { $("f-enviar").href = waLink(mensagem()); };
$("f-limpar").onclick = () => { carrinho = {}; salvar(); fecharFolha(); atualizarBarra(); render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharFolha(); });

render(); atualizarBarra();
</script>
