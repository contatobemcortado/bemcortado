<title>Bem Cortado · Papelaria Fofa – Catálogo</title>
<meta name="description" content="Catálogo da Bem Cortado: escolha os produtos, veja fotos e preços e envie seu pedido pelo WhatsApp.">

<meta property="og:description" content="Veja fotos e preços, monte seu pedido e envie pelo WhatsApp 💜">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Identidade Bem Cortado · Papelaria Fofa: lilás, rosa e menta em degradê (tema claro único, de propósito) */
:root{
  color-scheme:light;
  --lilas:#A898E0; --rosa:#F2A6C3; --menta:#94D9BD;
  --lilas-claro:#F1ECFB; --rosa-claro:#FDEEF4; --menta-claro:#E8F7F0;
  --degrade:linear-gradient(90deg,#A898E0 0%,#F2A6C3 52%,#94D9BD 100%);
  --uva:#6E58B8;       /* lilás escuro: textos de destaque */
  --framboesa:#C04A82; /* rosa escuro: preços */
  --folha:#2F9670;     /* menta escuro: botões de adicionar/enviar */
  --fundo:#FCFAFE; --cartao:#FFFFFF; --texto:#3A3150; --suave:#7B7294; --linha:#EDE6F6;
  --display:"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* nomes antigos usados no resto do CSS/JS */
  --navy:var(--uva); --laranja:var(--rosa); --laranja-t:var(--framboesa); --verde:var(--folha);
  --topo:#FFFFFF; --topo-texto:var(--texto); --chip:var(--lilas-claro);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:110px;
  background-image:radial-gradient(circle at 12% 8%,rgba(168,152,224,.10) 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,rgba(242,166,195,.10) 0 90px,transparent 91px),radial-gradient(circle at 20% 85%,rgba(148,217,189,.12) 0 110px,transparent 111px);
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lilas);outline-offset:2px}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);color:var(--texto);padding:10px 16px;border-bottom:0}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--degrade)}
.topo-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:44px}
.voltar{flex:none;border:0;background:var(--lilas-claro);color:var(--uva);border-radius:999px;padding:9px 15px;font-weight:800;font-size:14px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;line-height:1;color:var(--uva)}
.marca img{width:40px;height:auto;display:block}
.marca small{display:block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--folha);margin-top:3px}
.titulo{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15;text-wrap:balance;color:var(--uva)}
.migalha{font-size:11px;color:var(--suave);letter-spacing:.06em;text-transform:uppercase;font-weight:700}

main{max-width:760px;margin:0 auto;padding:22px 16px 0}

/* capa da página inicial */
.capa{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 18px}
.capa img{width:min(250px,64vw);height:auto}
.dica{color:var(--suave);font-size:15px;margin:4px auto 18px;max-width:34ch;text-align:center}
.dica b{color:var(--framboesa)}

/* lista de categorias: cartões com foto */
.cats{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;width:100%;text-align:left;background:var(--cartao);border:1.5px solid var(--linha);border-radius:22px;padding:0;overflow:hidden;box-shadow:0 3px 0 var(--linha)}
.cat-foto{display:block;aspect-ratio:1/1;max-width:100%;background:#fff;position:relative;border-bottom:4px solid var(--cor-bola,var(--lilas))}
.cat:nth-child(3n+2) .cat-foto{--cor-bola:var(--rosa)}
.cat:nth-child(3n+3) .cat-foto{--cor-bola:var(--menta)}
.cat-foto img{width:100%;height:100%;object-fit:contain;display:block;padding:8px}
.cat-foto.sem,.cat-breve .cat-foto{background:radial-gradient(circle at 30% 30%,var(--rosa-claro) 0 20%,transparent 21%),radial-gradient(circle at 70% 68%,var(--menta-claro) 0 24%,transparent 25%),var(--lilas-claro)}
.cat-txt{display:flex;flex-direction:column;gap:6px;padding:10px 12px 12px;align-items:flex-start}
.cat b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.15;color:var(--texto);text-wrap:balance}
.cat .qt{font-size:12px;color:var(--uva);background:var(--lilas-claro);border-radius:999px;padding:3px 10px;font-weight:700}
.cat .qt.breve{color:var(--framboesa);background:var(--rosa-claro)}

/* produtos */
.grade{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:520px){.grade{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:760px){.grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prod{background:var(--cartao);border:1.5px solid var(--linha);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 0 var(--linha)}
.prod.sel{border-color:var(--menta);box-shadow:0 3px 0 var(--menta)}
.foto{position:relative;background:#fff;aspect-ratio:1/1;max-width:100%}
.foto img{width:100%;height:100%;object-fit:contain;display:block}
.num{position:absolute;top:8px;left:8px;background:var(--degrade);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(90,70,140,.35)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.nome{font-weight:700;font-size:16px;line-height:1.3}
.foto.toca{cursor:zoom-in}
.foto.toca::after{content:"🔍 toque para ampliar";position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:700;color:var(--uva);background:rgba(255,255,255,.9);border-radius:999px;padding:3px 8px}
.det{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:pre-line}
.preco{font-family:var(--display);font-weight:700;font-size:23px;color:var(--framboesa);margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.add{width:100%;margin-top:6px;border:0;border-radius:999px;background:var(--folha);color:#fff;font-weight:800;padding:13px 8px;font-size:16px}
.qtd{margin-top:6px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:2px solid var(--menta);border-radius:999px;overflow:hidden;background:var(--menta-claro)}
.qtd button{border:0;background:transparent;font-size:20px;font-weight:800;color:var(--folha);height:36px}
.qtd span{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.semfoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:12px;font-weight:700;background:radial-gradient(circle at 30% 30%,var(--rosa-claro) 0 18%,transparent 19%),radial-gradient(circle at 70% 65%,var(--menta-claro) 0 22%,transparent 23%),var(--lilas-claro)}
.esgotado .foto{opacity:.45}.esg{margin-top:6px;text-align:center;font-weight:700;color:var(--suave);border:1.5px dashed var(--linha);border-radius:999px;padding:9px}

.vazio{background:var(--cartao);border:2px dashed var(--lilas);border-radius:24px;padding:28px 18px;text-align:center}
.vazio h3{font-family:var(--display);font-weight:600;margin:0 0 6px;font-size:21px;color:var(--uva)}
.vazio p{margin:0 0 16px;color:var(--suave)}
.btn-wa{display:inline-block;background:var(--folha);color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:12px 20px}

/* foto ampliada */
.zoom-fundo{position:fixed;inset:0;z-index:40;background:rgba(58,49,80,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.zoom{position:relative;background:#fff;border-radius:26px;overflow:hidden;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column}
.zoom::before{content:"";display:block;height:6px;background:var(--degrade);flex:none}
.zoom img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;min-height:0}
.z-info{padding:12px 16px 16px}
.z-nome{font-weight:700;font-size:16px;line-height:1.3}
.z-preco{font-family:var(--display);font-weight:700;font-size:24px;color:var(--framboesa)}
.z-fechar{position:absolute;top:14px;right:10px;z-index:2;border:0;width:40px;height:40px;border-radius:50%;background:var(--lilas-claro);color:var(--uva);font-size:18px;font-weight:800}

/* barra do pedido */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 22px rgba(110,88,184,.12)}
.barra::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--degrade)}
.barra-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.resumo{flex:1;min-width:0}
.resumo b{display:block;font-family:var(--display);font-weight:700;font-size:21px;color:var(--framboesa);font-variant-numeric:tabular-nums}
.resumo span{font-size:13px;color:var(--suave)}
.ver{border:0;background:var(--uva);color:#fff;border-radius:999px;padding:13px 20px;font-weight:800}
.ver:disabled{opacity:.4;cursor:default}

/* folha do pedido */
.folha-fundo{position:fixed;inset:0;z-index:30;background:rgba(58,49,80,.45);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--fundo);width:100%;max-width:760px;max-height:88%;border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.folha::before{content:"";display:block;height:6px;background:var(--degrade);flex:none}
.folha-cab{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;gap:10px}
.folha-cab h2{margin:0;font-family:var(--display);font-weight:600;font-size:23px;color:var(--uva)}
.fechar{border:0;background:var(--lilas-claro);color:var(--uva);border-radius:999px;padding:8px 14px;font-weight:800}
.itens{overflow-y:auto;padding:4px 16px;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--cartao);border:1.5px solid var(--linha);border-radius:18px;padding:8px}
.item img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px}
.item .n{font-weight:700;font-size:14px;line-height:1.25}
.item .s{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.item .qtd{margin:0;grid-template-columns:32px 30px 32px}
.item .qtd button{height:32px;font-size:18px}
.folha-pe{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1.5px solid var(--linha)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.total b{font-family:var(--display);font-weight:700;font-size:26px;color:var(--framboesa);font-variant-numeric:tabular-nums}
label{font-size:13px;color:var(--suave);font-weight:700}
input{width:100%;font:inherit;padding:11px 14px;border-radius:999px;border:1.5px solid var(--linha);background:#fff;color:var(--texto)}
.enviar{display:block;text-align:center;background:var(--folha);color:#fff;text-decoration:none;font-family:var(--display);font-weight:600;font-size:18px;border-radius:999px;padding:15px}
.limpar{border:0;background:transparent;color:var(--suave);text-decoration:underline;font-size:13px;align-self:center}
.aviso{font-size:12px;color:var(--suave);text-align:center;margin:0}
@media (prefers-reduced-motion:no-preference){
  .prod,.cat{transition:transform .15s,border-color .15s,box-shadow .15s}
  .cat:active,.add:active{transform:translateY(2px)}
  .prod.sel{animation:pulo .35s ease}
  @keyframes pulo{50%{transform:scale(1.03)}}
}
</style>

</head>
<body>
<header class="topo"><div class="topo-in" id="topo"></div></header>
<main id="tela"></main>

<div class="barra"><div class="barra-in">
  <div class="resumo"><b id="b-total">R$ 0,00</b><span id="b-itens">Nenhum item escolhido</span></div>
  <button class="ver" id="b-ver" disabled>Ver pedido</button>
</div></div>

<div class="zoom-fundo" id="zoom" hidden>
  <div class="zoom" role="dialog" aria-modal="true" aria-labelledby="z-nome">
    <button class="z-fechar" id="z-fechar" aria-label="Fechar foto">✕</button>
    <img id="z-img" alt="">
    <div class="z-info"><div class="z-nome" id="z-nome"></div><div class="z-preco" id="z-preco"></div></div>
  </div>
</div>

<div class="folha-fundo" id="folha" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="f-tit">
    <div class="folha-cab"><h2 id="f-tit">Seu pedido</h2><button class="fechar" id="f-fechar">‹ Continuar</button></div>
    <div class="itens" id="f-itens"></div>
    <div class="folha-pe">
      <div class="total"><span>Total</span><b id="f-total">R$ 0,00</b></div>
      <div><label for="f-nome">Seu nome (opcional)</label><input id="f-nome" autocomplete="name" placeholder="Ex.: Maria"></div>
      <a class="enviar" id="f-enviar" href="#" target="_blank" rel="noopener">Enviar pedido pelo WhatsApp</a>
      <p class="aviso">Abre o WhatsApp da Bem Cortado com a lista pronta. É só tocar em enviar.</p>
      <button class="limpar" id="f-limpar">Esvaziar pedido</button>
    </div>
  </div>
</div>

  const t = $("topo");
  if (!pilha.length){
    t.innerHTML = '<div class="marca"><img alt="" src="' + LOGO_ICONE + '"><div>BEM CORTADO<small>Papelaria fofa</small></div></div>';
  } else {
    t.innerHTML = '<button class="voltar" id="voltar">‹ Voltar</button><div><div class="migalha"></div><div class="titulo"></div></div>';
    t.querySelector(".migalha").textContent = migalha;
    t.querySelector(".titulo").textContent = titulo;
    $("voltar").onclick = () => { pilha.pop(); render(); };
  }
}

function fotosDe(c){
  const ids = []; (function junta(x){ if (x.sub) x.sub.forEach(junta); else ids.push(x.id); })(c);
  return PRODS.filter(p => ids.includes(p.cat) && p.img).map(p => p.img);
}
function listaCats(lista){
  const box = document.createElement("div"); box.className = "cats";
  lista.forEach(c => {
    const n = contaCat(c);
    const b = document.createElement("button"); b.className = "cat" + (n ? "" : " cat-breve");
    b.innerHTML = '<span class="cat-foto"></span><span class="cat-txt"><b></b><span class="qt"></span></span>';
    b.querySelector("b").textContent = c.nome;
    const q = b.querySelector(".qt");
    q.textContent = n ? n + (n === 1 ? " item" : " itens") : "em breve";
    if (!n) q.classList.add("breve");
    const fotos = fotosDe(c), caixa = b.querySelector(".cat-foto");
    // tenta as fotos da categoria até uma carregar
    (function tenta(k){
      if (k >= Math.min(fotos.length, 6)) { caixa.classList.add("sem"); return; }
      const im = new Image(); im.alt = ""; im.referrerPolicy = "no-referrer";
      im.onload = () => caixa.appendChild(im); im.onerror = () => tenta(k + 1); im.src = fotos[k];
    })(0);
    b.onclick = () => { pilha.push(c.id); render(); window.scrollTo(0, 0); };
    box.appendChild(b);
  });
  return box;
}

// foto ampliada ao tocar no produto
function ampliar(p){
  const z = $("zoom"); z.hidden = false;
  const im = $("z-img"); im.src = p.img; im.alt = p.nome;
  $("z-nome").textContent = p.nome;
  $("z-preco").textContent = p.preco ? real(p.preco) : "Consulte";
}

function cardProduto(p, i){
  const d = document.createElement("article"); d.className = "prod"; d.dataset.id = p.id;
  d.innerHTML = '<div class="foto"><img alt=""><span class="num"></span></div><div class="info"><div class="nome"></div><div class="det"></div><div class="preco"></div><div class="acao"></div></div>';
  const im = d.querySelector("img"); im.alt = p.nome; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
  im.onerror = () => { const f = im.parentNode; im.remove(); const s = document.createElement("div"); s.className = "semfoto"; s.textContent = "Foto indisponível"; f.appendChild(s); };
  if (p.img) { im.src = p.img; d.querySelector(".foto").onclick = () => { if (im.isConnected) ampliar(p); }; d.querySelector(".foto").classList.add("toca"); } else im.onerror();
  d.querySelector(".num").textContent = "Nº " + String(i + 1).padStart(2, "0");
  d.querySelector(".nome").textContent = p.nome;
  d.querySelector(".det").textContent = p.det + (p.ean ? "\nCód. " + p.ean : "");
  d.querySelector(".preco").textContent = p.preco ? real(p.preco) : "Consulte";
  if (p.estoque !== undefined && p.estoque !== null && p.estoque <= 0){
    d.classList.add("esgotado"); d.querySelector(".acao").innerHTML = '<div class="esg">Esgotado</div>'; return d;
  }
  desenharAcao(d, p);
  return d;
}

function stepper(p){
  const q = document.createElement("div"); q.className = "qtd";
  q.innerHTML = '<button aria-label="Tirar um">−</button><span></span><button aria-label="Mais um">+</button>';
  q.querySelector("span").textContent = carrinho[p.id];
  const [menos, , mais] = q.children;
  menos.onclick = () => mudar(p.id, -1); mais.onclick = () => mudar(p.id, 1);
  return q;
}

function desenharAcao(d, p){
  const a = d.querySelector(".acao"); a.innerHTML = "";
  if (carrinho[p.id]) { a.appendChild(stepper(p)); d.classList.add("sel"); }
  else {
    const b = document.createElement("button"); b.className = "add"; b.textContent = "+ Adicionar";
    b.onclick = () => mudar(p.id, 1); a.appendChild(b); d.classList.remove("sel");
  }
}

function mudar(id, delta){
  carrinho[id] = (carrinho[id] || 0) + delta;
  if (carrinho[id] <= 0) delete carrinho[id];
  salvar();
  document.querySelectorAll('.prod[data-id="' + id + '"]').forEach(d => desenharAcao(d, byId[id]));
  atualizarBarra();
  if (!$("folha").hidden) desenharFolha();
}

function render(){
  const tela = $("tela"); tela.innerHTML = "";
  const atual = pilha[pilha.length - 1];
  if (!atual){
    topo();
    const capa = document.createElement("div"); capa.className = "capa";
    capa.innerHTML = '<img alt="Bem Cortado · Papelaria Fofa" src="' + LOGO_COMPLETO + '">';
    const p = document.createElement("p"); p.className = "dica";
    p.innerHTML = "Escolha a categoria, adicione quantos produtos quiser e envie o pedido completo pelo <b>WhatsApp</b> no final.";
    tela.append(capa, p, listaCats(CATS));
    return;
  }
  const {c, trilha} = acharCat(atual);
  topo(c.nome, ["Papelaria"].concat(trilha).join(" › "));
  if (c.sub){ tela.appendChild(listaCats(c.sub)); return; }
  const ps = prodsDe(c.id);
  if (!ps.length){
    const v = document.createElement("div"); v.className = "vazio";
    v.innerHTML = '<h3>Fotos em breve</h3><p>Ainda estamos fotografando esta categoria. Pergunte o que temos:</p><a class="btn-wa" target="_blank" rel="noopener"></a>';
    const a = v.querySelector("a"); a.textContent = "Perguntar sobre " + c.nome; a.href = waLink("Olá! Quero ver opções de " + c.nome);
    tela.appendChild(v); return;
  }
  const g = document.createElement("div"); g.className = "grade";
  ps.forEach((p, i) => g.appendChild(cardProduto(p, i)));
  tela.appendChild(g);
}

function itensPedido(){ return Object.entries(carrinho).map(([id, q]) => ({p: byId[id], q})); }
function totalPedido(){ return itensPedido().reduce((s, {p, q}) => s + (p.preco || 0) * q, 0); }

function atualizarBarra(){
  const its = itensPedido(); const un = its.reduce((s, x) => s + x.q, 0);
  $("b-total").textContent = real(totalPedido());
  $("b-itens").textContent = un ? un + (un === 1 ? " unidade" : " unidades") + " · " + its.length + (its.length === 1 ? " produto" : " produtos") : "Nenhum item escolhido";
  $("b-ver").disabled = !un;
}

function mensagem(){
  const nome = $("f-nome").value.trim();
  let t = "Olá! Quero fazer este pedido" + (nome ? " (" + nome + ")" : "") + ":\n\n";
  itensPedido().forEach(({p, q}) => {
    t += "• " + q + "x " + p.nome + (p.ean ? " – Cód. " + p.ean : "") + " – " + (p.preco ? real(p.preco * q) : "consultar") + "\n";
  });
  t += "\nTotal: " + real(totalPedido());
  return t;
}

function desenharFolha(){
  const box = $("f-itens"); box.innerHTML = "";
  const its = itensPedido();
  if (!its.length){ fecharFolha(); return; }
  its.forEach(({p}) => {
    const r = document.createElement("div"); r.className = "item";
    r.innerHTML = '<img alt=""><div><div class="n"></div><div class="s"></div></div>';
    const ri = r.querySelector("img"); ri.referrerPolicy = "no-referrer"; ri.onerror = () => { ri.style.visibility = "hidden"; }; if (p.img) ri.src = p.img; else ri.onerror();
    r.querySelector(".n").textContent = p.nome;
    r.querySelector(".s").textContent = (p.preco ? real(p.preco) + " cada" : "Consulte") + (p.ean ? " · " + p.ean : "");
    r.appendChild(stepper(p));
    box.appendChild(r);
  });
  $("f-total").textContent = real(totalPedido());
  $("f-enviar").href = waLink(mensagem());
}
function abrirFolha(){ $("folha").hidden = false; desenharFolha(); }
function fecharFolha(){ $("folha").hidden = true; }

$("b-ver").onclick = abrirFolha;
$("z-fechar").onclick = () => { $("zoom").hidden = true; };
$("zoom").onclick = e => { if (e.target.id === "zoom") $("zoom").hidden = true; };
$("f-fechar").onclick = fecharFolha;
$("folha").onclick = e => { if (e.target.id === "folha") fecharFolha(); };
$("f-nome").oninput = () => { $("f-enviar").href = waLink(mensagem()); };
$("f-limpar").onclick = () => { carrinho = {}; salvar(); fecharFolha(); atualizarBarra(); render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") { fecharFolha(); $("zoom").hidden = true; } });

// link direto para uma categoria: ...#papel-crepom abre direto nela
function caminhoAte(id, lista = CATS, trilha = []){
  for (const c of lista){
    if (c.id === id) return trilha.concat(c.id);
    if (c.sub){ const r = caminhoAte(id, c.sub, trilha.concat(c.id)); if (r) return r; }
  }
  return null;
}
function abrirPeloLink(){
  const id = decodeURIComponent((location.hash || "").slice(1));
  const cam = id ? caminhoAte(id) : null;
  if (cam){ pilha = cam; }
}
abrirPeloLink();
window.addEventListener("hashchange", () => { abrirPeloLink(); render(); window.scrollTo(0, 0); });
render(); atualizarBarra();
</script>

</body>
